<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MiniERP - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#924700",
                        "primary": "#0058be",
                        "background": "#f7f9ff",
                        "on-surface-variant": "#424754",
                        "surface-variant": "#e0e3e8",
                        "on-error": "#ffffff",
                        "on-primary-container": "#fefcff",
                        "tertiary-container": "#b75b00",
                        "inverse-primary": "#adc6ff",
                        "on-background": "#181c20",
                        "on-secondary": "#ffffff",
                        "primary-fixed": "#d8e2ff",
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-tint": "#005ac2",
                        "outline": "#727785",
                        "tertiary-fixed": "#ffdcc6",
                        "on-secondary-fixed": "#0b1c30",
                        "secondary-fixed": "#d3e4fe",
                        "surface": "#f7f9ff",
                        "tertiary-fixed-dim": "#ffb786",
                        "secondary-fixed-dim": "#b7c8e1",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#fffbff",
                        "secondary-container": "#d0e1fb",
                        "surface-container-low": "#f1f4f9",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e5e8ee",
                        "on-secondary-fixed-variant": "#38485d",
                        "secondary": "#505f76",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#d7dadf",
                        "surface-container-highest": "#e0e3e8",
                        "inverse-on-surface": "#eef1f6",
                        "on-tertiary-fixed": "#311400",
                        "outline-variant": "#c2c6d6",
                        "on-tertiary-fixed-variant": "#723600",
                        "on-surface": "#181c20",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#001a42",
                        "primary-fixed-dim": "#adc6ff",
                        "inverse-surface": "#2d3135",
                        "on-secondary-container": "#54647a",
                        "surface-bright": "#f7f9ff",
                        "on-primary-fixed-variant": "#004395",
                        "primary-container": "#2170e4",
                        "surface-container": "#ebeef3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "base": "4px",
                        "margin-desktop": "32px",
                        "sm": "8px",
                        "xl": "32px",
                        "lg": "24px",
                        "margin-mobile": "16px",
                        "md": "16px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "display": ["Inter"],
                        "headline-md": ["Inter"],
                        "data-tabular": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "display": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "data-tabular": ["13px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Outline Input Style */
        .input-outlined {
            position: relative;
        }
        .input-outlined input {
            padding: 16px 16px 12px;
            width: 100%;
            border: 1px solid theme('colors.outline-variant');
            border-radius: theme('borderRadius.lg');
            background-color: transparent;
            color: theme('colors.on-surface');
            outline: none;
            transition: border-color 0.2s ease;
        }
        .input-outlined input:focus {
            border-color: theme('colors.primary');
            border-width: 2px;
            padding: 15px 15px 11px; /* adjust for border width */
        }
        .input-outlined label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: theme('colors.on-surface-variant');
            font-size: theme('fontSize.body-md[0]');
            pointer-events: none;
            transition: 0.2s ease all;
            background-color: theme('colors.surface-container-lowest');
            padding: 0 4px;
        }
        .input-outlined input:focus ~ label,
        .input-outlined input:not(:placeholder-shown) ~ label {
            top: 0;
            font-size: theme('fontSize.label-sm[0]');
            color: theme('colors.primary');
        }
        .input-outlined input:not(:focus):not(:placeholder-shown) ~ label {
            color: theme('colors.on-surface-variant');
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-md">
<!-- Ambient Background Element -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute top-[60%] -right-[10%] w-[40%] h-[40%] rounded-full bg-secondary/5 blur-[100px]"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-md">
<!-- Welcome Message -->
<div class="text-center mb-lg">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Bem-vindo de volta</p>
</div>
<!-- Main Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] p-xl">
<!-- Branding -->
<div class="text-center mb-xl">
<h1 class="font-display text-display text-primary tracking-tight mb-sm">MiniERP</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Gestão pessoal e doméstica</p>
</div>
<!-- Form -->
<form action="#" class="space-y-md" method="POST">
<!-- Email Field -->
<div class="input-outlined">
<input autocomplete="email" class="font-body-md text-body-md" id="email" name="email" placeholder=" " required="" type="email"/>
<label class="font-body-md" for="email">E-mail</label>
</div>
<!-- Password Field -->
<div class="input-outlined">
<input autocomplete="current-password" class="font-body-md text-body-md" id="password" name="password" placeholder=" " required="" type="password"/>
<label class="font-body-md" for="password">Senha</label>
</div>
<!-- Options -->
<div class="flex items-center justify-between pt-xs pb-sm">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer appearance-none w-4 h-4 border border-outline-variant rounded-[4px] checked:bg-primary checked:border-primary transition-colors cursor-pointer" type="checkbox"/>
<span class="material-symbols-outlined absolute left-[50%] top-[50%] -translate-x-1/2 -translate-y-1/2 text-[12px] text-on-primary opacity-0 peer-checked:opacity-100 pointer-events-none">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Lembrar-me</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Esqueci a senha</a>
</div>
<!-- Submit Button -->
<button class="w-full h-[44px] bg-primary text-on-primary font-label-sm text-label-sm rounded-lg hover:bg-primary-container transition-colors duration-200 shadow-sm active:scale-[0.98]" type="submit">
                    Entrar
                </button>
</form>
</div>
<!-- Footer Links -->
<div class="text-center mt-lg">
<p class="font-body-md text-body-md text-on-surface-variant">
                Não tem uma conta? <a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Criar conta</a>
</p>
</div>
</main>
</body></html>
